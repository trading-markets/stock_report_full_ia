name: Stock Report IA (Auto)

on:
  schedule:
    # ⚠️ Heures en UTC (à ajuster selon ton fuseau)
    - cron: '15 9 * * *'    # 09:15 UTC
    - cron: '15 15 * * *'   # 15:15 UTC
  workflow_dispatch:

jobs:
  run-stock-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance openai requests

      - name: Run stock report script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python stock_report_full_ia_v2.py --send
