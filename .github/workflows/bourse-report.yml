name: Bourse Auto Report

on:
  schedule:
    # 09:15 UTC
    - cron: '15 9 * * *'
    # 15:15 UTC
    - cron: '15 15 * * *'
  workflow_dispatch:  

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests python-dotenv

      - name: Run report script
        env:
          CLAUDE_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:  ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python report.py --send
